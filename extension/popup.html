<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Phishing Detector</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    
<div class="container">

    <h2>🛡 AI Phishing Detector</h2>

<div class="card">
    <div class="title">🌐 Website</div>
    <div id="url">Loading...</div>
</div>

<div class="status-card">
    <div id="riskLevel">Ready to Scan</div>
    <div id="confidence">Click Scan Website</div>
</div>

<div class="card">
    <h3>🔒 SSL Security</h3>
    <div id="ssl"></div>
</div>

<div class="card">
    <h3>🦠 VirusTotal</h3>
    <div id="vt"></div>
</div>

<div class="card">
    <h3>🌍 Domain Information</h3>
    <div id="domainInfo"></div>
</div>

<div class="card">
    <h3>🤖 AI Analysis</h3>
    <div id="summary"></div>
</div>

<button id="scanButton">Scan Website</button>

</div>

<script src="popup.js"></script>

</body>
</html>
